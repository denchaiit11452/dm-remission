services:
  postgres:
    image: postgres:16-alpine
    container_name: dm_remission_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # ไม่มีรหัสผ่านสำรอง: ต้องสั่ง docker compose --env-file .env.production ... เสมอ (ดู README.md)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD โดยสั่ง docker compose --env-file .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-dm_remission}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ผูกไว้เฉพาะ localhost พอร์ต 5433 เพื่อไม่ให้ชนกับ 5432 เดิมของเครื่อง
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dm_remission}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dm_remission_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dm_remission}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dm_remission}?schema=public
    env_file:
      - path: .env.local
        required: false
      - path: .env.production
        required: false

volumes:
  postgres_data:
    name: dm_remission_pgdata
